<style>
  :root {
    --bg: #F2F6F5;
    --ink: #0B1426;
    --muted: #4F5D73;
    --row: #FFFFFF;
    --row-edge: #D8E3E0;
    --green: #18AF7C;
    --green-deep: #167B60;
    --green-bright: #2FCD94;
    --on-green: #0B1426;
    --glow-a: rgba(47, 205, 148, .38);
    --glow-b: rgba(22, 123, 96, .30);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1426;
      --ink: #EEF3F7;
      --muted: #9AA8BC;
      --row: #121F38;
      --row-edge: #1F2F4F;
      --green: #2FCD94;
      --green-deep: #18AF7C;
      --green-bright: #30CF95;
      --on-green: #0B1426;
      --glow-a: rgba(47, 205, 148, .30);
      --glow-b: rgba(24, 175, 124, .22);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1426;
      --ink: #EEF3F7;
      --muted: #9AA8BC;
      --row: #121F38;
      --row-edge: #1F2F4F;
      --green: #2FCD94;
      --green-deep: #18AF7C;
      --green-bright: #30CF95;
      --on-green: #0B1426;
      --glow-a: rgba(47, 205, 148, .30);
      --glow-b: rgba(24, 175, 124, .22);
      color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 3rem 1.25rem 2.5rem;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 26rem; }

  /* The one memorable thing: a living aura behind the mark */
  .mark {
    position: relative;
    width: 7.5rem; height: 7.5rem;
    margin: 0 auto 1.75rem;
    display: grid; place-items: center;
  }
  .mark::before, .mark::after {
    content: "";
    position: absolute;
    inset: -1.5rem;
    border-radius: 40%;
    filter: blur(22px);
    z-index: 0;
  }
  .mark::before { border-radius: 2rem; background: radial-gradient(circle at 35% 40%, var(--glow-a), transparent 65%); animation: drift 9s ease-in-out infinite; }
  .mark::after  { background: radial-gradient(circle at 65% 60%, var(--glow-b), transparent 60%); animation: drift 9s ease-in-out infinite reverse; }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(6px, -6px) scale(1.08); }
  }
  .mark .logo {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    border-radius: 1.45rem;
    box-shadow: 0 10px 30px -12px rgba(11, 20, 38, .55);
  }

  header { text-align: center; margin-bottom: 2rem; }
  h1 {
    font-size: clamp(2.1rem, 9vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -.035em;
    line-height: 1.05;
  }
  header p {
    color: var(--muted);
    margin-top: .6rem;
    font-size: 1.02rem;
    max-width: 22rem;
    margin-inline: auto;
  }

  nav { display: grid; gap: .7rem; }
  .link {
    display: flex; align-items: center; gap: .95rem;
    padding: .95rem 1.1rem;
    min-height: 4rem;
    background: var(--row);
    border: 1px solid var(--row-edge);
    border-radius: 1rem;
    color: var(--ink);
    text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  .link:hover { border-color: var(--green); }
  .link:active { transform: scale(.985); }
  .link:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
  .icon {
    flex: none;
    width: 2.5rem; height: 2.5rem;
    border-radius: .7rem;
    display: grid; place-items: center;
    color: #fff;
  }
  .icon svg { width: 1.3rem; height: 1.3rem; fill: currentColor; }
  .fb   { background: #1877F2; }
  .li   { background: #0A66C2; }
  .web  { background: #0B1426; color: var(--green-bright); box-shadow: inset 0 0 0 1px var(--row-edge); }
  .prod { background: linear-gradient(140deg, var(--green-bright), var(--green-deep)); color: var(--on-green); }
  .text { display: flex; flex-direction: column; min-width: 0; }
  .text strong { font-weight: 600; font-size: 1.05rem; line-height: 1.25; }
  .text small { color: var(--muted); font-size: .88rem; }

  /* Product row gets a little more weight */
  .featured { border-color: var(--green); border-width: 1.5px; background: linear-gradient(var(--row), var(--row)) padding-box, linear-gradient(120deg, var(--green-bright), var(--green-deep)) border-box; border-color: transparent; }
  .featured .text small { color: var(--green-deep); }
  :root[data-theme="dark"] .featured .text small { color: var(--green); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .featured .text small { color: var(--green); } }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
    margin-top: 2.5rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .mark::before, .mark::after { animation: none; }
    .link { transition: none; }
  }
</style>
</head>
